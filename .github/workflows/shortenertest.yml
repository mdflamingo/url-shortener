name: autotests

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  branchtest:
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        run: |
          if [[ ! $GITHUB_HEAD_REF =~ ^iter[0-9]+$ ]] && [[ ${{ github.ref }} != "refs/heads/main" ]]; then echo "Branch name must match pattern 'iter<number>' or github.ref must be 'refs/heads/main'" && echo "Your branch is $GITHUB_HEAD_REF and github.ref is ${{ github.ref }}" && exit 1; else echo "Your branch is $GITHUB_HEAD_REF and github.ref is ${{ github.ref }}"; fi

  shortenertest:
    runs-on: ubuntu-latest
    container: golang:1.24
    needs: branchtest

    env:
      DATABASE_CONN_STRING: "postgres://postgres:postgres@postgres:5432/praktikum?sslmode=disable"
      TEST_ENV: "true"
      GITHUB_ACTIONS: "true"
      LOG_LEVEL: "debug"

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: praktikum
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Download autotests binaries
        uses: robinraju/release-downloader@v1.8
        with:
          repository: Yandex-Practicum/go-autotests
          latest: true
          fileName: "*"
          out-file-path: .tools
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup autotest binary
        run: |
          chmod -R +x $GITHUB_WORKSPACE/.tools
          mv $GITHUB_WORKSPACE/.tools/shortenertest_v2 /usr/local/bin/shortenertest
          mv $GITHUB_WORKSPACE/.tools/random /usr/local/bin/random
          mv $GITHUB_WORKSPACE/.tools/wipedb /usr/local/bin/wipedb

      - name: Setup go deps
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.23.0

      - name: Debug environment
        run: |
          echo "Current directory: $(pwd)"
          echo "Go version: $(go version)"
          echo "User: $(whoami)"
          echo "Files in current directory:"
          ls -la
          echo "Disk space:"
          df -h

      - name: Build server binary with debug info
        run: |
          cd cmd/shortener
          go build -buildvcs=false -gcflags="all=-N -l" -o shortener
          echo "Binary built successfully"
          ls -la shortener

      - name: "Code increment #1 with debug"
        if: |
          github.ref == 'refs/heads/main' ||
          github.head_ref == 'iter1' ||
          github.head_ref == 'iter2' ||
          github.head_ref == 'iter3' ||
          github.head_ref == 'iter4' ||
          github.head_ref == 'iter5' ||
          github.head_ref == 'iter6' ||
          github.head_ref == 'iter7' ||
          github.head_ref == 'iter8' ||
          github.head_ref == 'iter9' ||
          github.head_ref == 'iter10' ||
          github.head_ref == 'iter11' ||
          github.head_ref == 'iter12' ||
          github.head_ref == 'iter13' ||
          github.head_ref == 'iter14' ||
          github.head_ref == 'iter15' ||
          github.head_ref == 'iter16' ||
          github.head_ref == 'iter17' ||
          github.head_ref == 'iter18' ||
          github.head_ref == 'iter19' ||
          github.head_ref == 'iter20' ||
          github.head_ref == 'iter21' ||
          github.head_ref == 'iter22' ||
          github.head_ref == 'iter23' ||
          github.head_ref == 'iter24'
        run: |
          # Проверяем доступность порта
          echo "Checking port 8080 availability..."
          netstat -tulpn 2>/dev/null || echo "netstat not available"
          
          # Запускаем тест с подробным выводом
          shortenertest -test.v -test.run=^TestIteration1$ \
              -binary-path=cmd/shortener/shortener \
              -test.timeout=30s 2>&1 | tee test_output.log
          
          # Если тест упал, показываем дополнительную информацию
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== TEST FAILED DETAILS ==="
            echo "Checking if server process is running..."
            ps aux | grep shortener || echo "No shortener process found"
            
            echo "Checking file permissions..."
            ls -la /tmp/ || echo "Cannot list /tmp"
            
            echo "Checking network ports..."
            ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null || echo "Cannot check ports"
            
            echo "=== END OF DEBUG INFO ==="
            exit 1
          fi

